name: Deploy uploaded zip
# Upload a project zip to the repo root; this unpacks it over the repo
# (code only: content/ and public/logos/ belong to the dashboard and are never touched) and commits, which triggers Vercel.
on:
  push:
    paths: ["**.zip"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip over the repo
        run: |
          set -e
          ZIP=$(find . -name "*.zip" -not -path "./.git/*" | head -1)
          if [ -z "$ZIP" ]; then echo "No zip found"; exit 0; fi
          echo "Unpacking $ZIP"
          mkdir -p /tmp/unz
          unzip -q "$ZIP" -d /tmp/unz && rm -f "$ZIP"
          PKG=$(find /tmp/unz -name package.json -not -path "*/node_modules/*" -printf "%d %p\n" | sort -n | head -1 | cut -d" " -f2)
          SRC=$(dirname "$PKG")
          echo "Project root inside zip: $SRC"
          rsync -a --delete --exclude=".git" --exclude=".github" --exclude="node_modules" --exclude=".next" --exclude="/content/" --exclude="/public/logos/" "$SRC"/ ./
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -m "Deploy project files from $ZIP"
          git push
