name: Deploy uploaded zip
# Upload a project zip to the repo root; this unpacks it over the repo
# (removing files that are no longer in the zip) and commits, which triggers Vercel.
on:
  push:
    paths: ["*.zip"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip over the repo
        run: |
          set -e
          ZIP=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then echo "No zip found"; exit 0; fi
          echo "Unpacking $ZIP"
          mkdir -p /tmp/unz
          unzip -q "$ZIP" -d /tmp/unz
          PKG=$(find /tmp/unz -name package.json -not -path "*/node_modules/*" -printf "%d %p\n" | sort -n | head -1 | cut -d" " -f2)
          SRC=$(dirname "$PKG")
          echo "Project root inside zip: $SRC"
          rsync -a --delete --exclude=".git" --exclude=".github" --exclude="node_modules" --exclude=".next" "$SRC"/ ./
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -m "Deploy project files from $ZIP"
          git push
